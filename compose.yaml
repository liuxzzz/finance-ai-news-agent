services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: finance_ai_news
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d finance_ai_news"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  agent:
    profiles: ["worker"]
    build:
      context: .
    env_file:
      - path: .env.local
        required: true
      - path: .env.feishu.local
        required: false
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/finance_ai_news
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - node apps/cli/dist/index.js migrate && node apps/cli/dist/index.js run-live --edition daily
    restart: "no"

volumes:
  postgres-data:
